<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        [href]{
            color:#fff;
            background-color: dodgerblue;
        }
        [target]{
            color:#fff;
            background-color: dodgerblue;
        }
        [href="#"]{
            color:#fff;
            background-color: dodgerblue;
        }
        [target="_blank"]{
            color:#fff;
            background-color: dodgerblue;
        }
        [class |="ele"]{
            color:#fff;
            background-color: dodgerblue;
        }
        [class $="ele"]{
            color:#fff;
            background-color: dodgerblue;
        }
        [class ^="ele"]{
            color:#fff;
            background-color: dodgerblue;
        }
        [class *="ele"]{
            color:#fff;
            background-color: dodgerblue;
        }

    </style>
</head>
<body>
    <a href="#" target="_blank">Link</a>
    <a href="" target="_self">Link</a>
    <a href="#" target="_blank">Link</a>
    <a href="#">Link</a>
    <div class="ele">Div 1</div>
    <div class="ele-block">Div 2</div>
    <div class="ele-excelr">Div 3</div>
    <div class="eleblock">Div 4</div>
    <div class="ele block">Div 5</div>
    <div class="block-ele">Div 6</div>
    <div class="blockele">Div 7</div>
    <div class="block ele">Div 7</div>
</body>
</html>
